name: Prix Cardmarket + déploiement GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Tous les jours à 06:15 UTC (le guide Cardmarket est régénéré vers 02:45, heure de Paris).
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mettre à jour les prix Cardmarket
        run: node scripts/update-prices.mjs
      - name: Enregistrer les prix dans le dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json public/data/history.json
          git diff --cached --quiet || git commit -m "data: prix Cardmarket du $(date -u +%Y-%m-%d)"
          git push
      - name: Construire l'application
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

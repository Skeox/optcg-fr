name: iOS — .ipa non signé (sideload)

# Produit un .ipa NON SIGNÉ à installer avec Sideloadly / AltStore (qui le signent avec votre
# identifiant Apple). Lancement manuel (Actions › ce workflow › Run workflow) ou sur tag "ios-*".
on:
  workflow_dispatch:
  push:
    tags: ['ios-*']

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire l'application web (base /)
        run: npm run build
      - name: Générer le projet iOS
        run: |
          npx cap add ios
          npx cap sync ios
          # Autorisation caméra (scanner) et photothèque (import de photo)
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Scanner vos cartes One Piece'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Choisir une photo de carte'" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'OPTCG FR'" ios/App/App/Info.plist || true
      - name: Compiler sans signature
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" build | xcpretty && exit ${PIPESTATUS[0]}
      - name: Empaqueter le .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr OPTCG-FR-unsigned.ipa Payload
          ls -la OPTCG-FR-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: OPTCG-FR-unsigned-ipa
          path: OPTCG-FR-unsigned.ipa
          retention-days: 30
